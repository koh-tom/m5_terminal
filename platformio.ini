[platformio]
default_envs = cores3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.embed_files =
    fonts/clock.vlw
    fonts/num84.vlw
    fonts/num40.vlw
    fonts/lat12.vlw
    fonts/jp13.vlw
    fonts/jp16.vlw
    fonts/jp20.vlw
    fonts/jp36.vlw
    fonts/eva24.vlw
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0

[env:cores3]
board = m5stack-cores3

[env:core2]
board = m5stack-core2

; Basic/Grayは4MBなのでアプリ領域を広げる
[env:basic]
board = m5stack-core-esp32
board_build.partitions = huge_app.csv
